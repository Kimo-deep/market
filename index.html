<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سوبر ماركت الذكي</title>
    <style>
        :root {
            --primary: #0f172a;
            --accent: #ef4444;
            --success: #22c55e;
            --white: #ffffff;
        }

        body {
            margin: 0; font-family: 'Segoe UI', Tahoma, sans-serif;
            background-color: #f8fafc; overflow-x: hidden;
        }

/* الحاوية */
#loader {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100vh;
    z-index: 9999;
    display: flex;
    pointer-events: none;
}

.curtain {
    width: 50%;
    height: 100%;
    background: var(--primary);
    position: absolute;
    top: 0;
    /* حركة انسيابية جداً */
    transition: transform 1.2s cubic-bezier(0.77, 0, 0.175, 1);
    will-change: transform;
}

/* الستارة اليسرى: تثبت في أقصى اليسار وتصغر باتجاهه */
.left {
    left: 0;
    transform-origin: left;
}

/* الستارة اليمنى: تثبت في أقصى اليمين وتصغر باتجاهه */
.right {
    right: 0;
    transform-origin: right;
}

/* حالة الفتح: "تقليص" الحجم باتجاه الأطراف */
#loader.active .left {
    transform: scaleX(0);
}

#loader.active .right {
    transform: scaleX(0);
}

/* الإخفاء النهائي */
#loader.gone {
    display: none !important;
}

        /* باقي التصميم */
        nav { 
            background: var(--primary); padding: 15px; 
            position: sticky; top: 0; z-index: 1000; 
            display: flex; justify-content: center; gap: 15px;
        }
        .filter-btn {
            background: transparent; border: 1px solid rgba(255,255,255,0.3);
            color: white; padding: 8px 20px; border-radius: 20px;
            cursor: pointer; font-weight: bold; transition: 0.3s;
        }
        .filter-btn.active, .filter-btn:hover {
            background: var(--accent); border-color: var(--accent);
        }

        #cart-panel {
            position: fixed; top: 0; left: -360px; width: 320px; height: 100%;
            background: white; z-index: 2000; transition: 0.5s cubic-bezier(0.77, 0, 0.175, 1);
            box-shadow: 10px 0 40px rgba(0,0,0,0.2); padding: 25px;
            display: flex; flex-direction: column;
        }
        #cart-panel.open { left: 0; }

        .close-cart-btn {
            background: #f1f5f9; border: none; padding: 10px;
            border-radius: 10px; cursor: pointer; margin-bottom: 20px;
            font-weight: bold; color: var(--primary); width: 100%;
        }

        .container { max-width: 1200px; margin: 30px auto; padding: 0 20px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 25px; }

        .shop-section { transition: opacity 0.5s ease; margin-bottom: 40px; }
        .shop-section.hidden { display: none !important; }

        .card {
            background: white; border-radius: 20px; padding: 20px;
            text-align: center; box-shadow: 0 5px 15px rgba(0,0,0,0.05);
            transition: 0.4s; position: relative; border: 1px solid #eee;
        }
        .card:hover { transform: translateY(-10px); border-color: var(--accent); }
        .card img { width: 100%; height: 160px; object-fit: contain; }

        .price { color: var(--success); font-size: 1.5rem; font-weight: bold; margin: 15px 0; }
        .add-btn {
            background: var(--primary); color: white; border: none;
            padding: 12px; width: 100%; border-radius: 10px; cursor: pointer; font-weight: bold;
        }

        .cart-toggle {
            position: fixed; bottom: 30px; left: 30px;
            background: var(--accent); color: white; border: none;
            width: 65px; height: 65px; border-radius: 50%;
            cursor: pointer; z-index: 1500; font-size: 24px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }

        footer { background: var(--primary); color: white; padding: 40px; text-align: center; margin-top: 50px; }
    </style>
</head>
<body>

    <div id="loader">
        <div class="curtain left"></div>
        <div class="curtain right"></div>
    </div>

    <div id="cart-panel">
        <button class="close-cart-btn" onclick="toggleCart()">⬅️ إرجاع القائمة</button>
        <h3>تفاصيل طلبك</h3>
        <input type="text" id="uname" placeholder="الاسم" style="width:100%; padding:10px; margin-bottom:10px; border-radius:8px; border:1px solid #ddd;">
        <input type="text" id="uaddr" placeholder="العنوان" style="width:100%; padding:10px; margin-bottom:20px; border-radius:8px; border:1px solid #ddd;">
        <div id="cart-list" style="flex-grow:1; overflow-y:auto; border-top:1px solid #eee; padding-top:10px;"></div>
        <div style="border-top:2px solid #eee; padding-top:15px;">
            <h4>الإجمالي: <span id="total-val">0</span> ريال</h4>
            <button onclick="sendWhatsApp()" style="width:100%; background:var(--success); color:white; border:none; padding:15px; border-radius:10px; cursor:pointer; font-weight:bold;">تأكيد عبر واتساب</button>
        </div>
    </div>

    <button class="cart-toggle" onclick="toggleCart()">🛒 <span id="badge" style="font-size:12px; background:white; color:red; padding:2px 5px; border-radius:50%; vertical-align:top;">0</span></button>

    <nav>
        <button class="filter-btn active" onclick="filterCategory('all', this)">الكل</button>
        <button class="filter-btn" onclick="filterCategory('chips', this)">شيبسات</button>
        <button class="filter-btn" onclick="filterCategory('drinks', this)">مشروبات</button>
        <button class="filter-btn" onclick="filterCategory('clean', this)">منظفات</button>
    </nav>

    <div class="container">
        <section id="chips-section" class="shop-section" data-category="chips">
            <h2 style="border-right: 5px solid var(--accent); padding-right: 15px;">قسم الشيبسات</h2>
            <div class="grid">
                <div class="card">
                    <img src="https://m.media-amazon.com/images/I/81vJyb43URL._SL1500_.jpg">
                    <h3>ليز عائلي ملح</h3>
                    <div class="price">8 ريال</div>
                    <button class="add-btn" onclick="addToCart('ليز ملح', 8)">إضافة للسلة</button>
                </div>
                <div class="card">
                    <img src="https://share.google/zS5ZSDJCXI8GtwdJ7">
                    <h3>دوريتوس</h3>
                    <div class="price">5 ريال</div>
                    <button class="add-btn" onclick="addToCart('دوريتوس', 5)">إضافة للسلة</button>
                </div>
            </div>
        </section>

        <section id="drinks-section" class="shop-section" data-category="drinks">
            <h2 style="border-right: 5px solid var(--accent); padding-right: 15px;">المشروبات الغازية</h2>
            <div class="grid">
                <div class="card">
                    <img src="https://share.google/cQ78w81Sl3OPgLwY8">
                    <h3>كوكاكولا</h3>
                    <div class="price">3 ريال</div>
                    <button class="add-btn" onclick="addToCart('كوكاكولا', 3)">إضافة للسلة</button>
                </div>
            </div>
        </section>
        <section id="clean-section" class="shop-section" data-category="clean">
            <h2 style="border-right: 5px solid var(--accent); padding-right: 15px;">المنظفات</h2>
            <div class="grid">
                <div class="card">
                    <img src="https://share.google/cQ78w81Sl3OPgLwY8">
                    <h3>شامبو </h3>
                    <div class="price">20 ريال</div>
                    <button class="add-btn" onclick="addToCart('شامبو', 20)">إضافة للسلة</button>
                </div>
            </div>
        </section>
    </div>

    <footer>
        <p>made by: adbul karim anan farajallah</p>
        <p> © 2026 AbdulKarim Anan Farajallah</p>
    </footer>
      

       <script>
   window.addEventListener('load', () => {
        const loader = document.getElementById('loader');
        
        // تأخير بسيط ليرى المستخدم الستارة وهي مغلقة للحظة
        setTimeout(() => {
            loader.classList.add('active');
            
            // حذف العنصر تماماً بعد انتهاء الأنميشن
            setTimeout(() => {
                loader.classList.add('gone');
            }, 1300);
        }, 300);
    });

    // باقي دوال الفلترة والسلة (كما هي في كودك السابق)
    function filterCategory(cat, btn) {
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        const sections = document.querySelectorAll('.shop-section');
        sections.forEach(sec => {
            if (cat === 'all' || sec.getAttribute('data-category') === cat) {
                sec.classList.remove('hidden');
            } else {
                sec.classList.add('hidden');
            }
        });
    }
    // ... وبقية الدوال

        function toggleCart() {
            document.getElementById('cart-panel').classList.toggle('open');
        }

        let cart = [];
        function addToCart(name, price) {
            cart.push({name, price});
            render();
            const btn = event.target;
            const originalText = btn.innerText;
            btn.innerText = "✅ تمت الإضافة";
            setTimeout(() => btn.innerText = originalText, 700);
        }

        function render() {
            const list = document.getElementById('cart-list');
            let total = 0;
            list.innerHTML = '';
            cart.forEach((item, index) => {
                total += item.price;
                list.innerHTML += `<div style="display:flex; justify-content:space-between; margin-bottom:10px; background:#f9f9f9; padding:10px; border-radius:8px;">
                    <span>${item.name}</span>
                    <span>${item.price} ريال <button onclick="remove(${index})" style="color:red; border:none; background:none; cursor:pointer;">✕</button></span>
                </div>`;
            });
            document.getElementById('total-val').innerText = total;
            document.getElementById('badge').innerText = cart.length;
        }

        function remove(i) { cart.splice(i, 1); render(); }

        function sendWhatsApp() {
            const n = document.getElementById('uname').value;
            const a = document.getElementById('uaddr').value;
            if(!n || !a || cart.length === 0) { alert("أكمل البيانات والسلة أولاً!"); return; }
            let msg = `*طلب جديد*\n👤 الاسم: ${n}\n📍 العنوان: ${a}\n----------\n`;
            cart.forEach((it, i) => msg += `${i+1}. ${it.name} (${it.price} ريال)\n`);
            msg += `----------\n💰 الإجمالي: ${document.getElementById('total-val').innerText} ريال`;
            window.open(`https://wa.me/970567113558?text=${encodeURIComponent(msg)}`);
        }
    </script>
</body>
</html>
